# herdr configuration
# Place this file at ~/.config/herdr/config.toml

onboarding = false
[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

[experimental]
kitty_graphics = true

[theme]
name = "gruvbox"
auto_switch = false

[update]
channel = "stable" # For Nix management
version_check = false # For Nix management


[keys]
prefix = "ctrl+a"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = ""
open_notification_target = "prefix+o"

# サイドバー
toggle_sidebar = "ctrl+shift+a"

# タブ
new_tab = "ctrl+t"
previous_tab = "ctrl+shift+tab"

# Pane
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "" # prefix+tab
cycle_pane_previous = "" # prefix+shift+tab
last_pane = "prefix+tab"          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
split_vertical = "prefix+|"
split_horizontal = "prefix+_"
close_pane = "prefix+x"
zoom = "prefix+m"
resize_mode = "" # default prefix+r
